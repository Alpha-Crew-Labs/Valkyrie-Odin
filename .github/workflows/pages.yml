name: Deploy VALKYRIE to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/valkyrie-v2.5/**'
      - 'prototype/valkyrie-v3/**'
      - 'scripts/update_equity_snapshot.mjs'
      - 'scripts/update_theme_snapshot.mjs'
      - 'scripts/update_market_strip_snapshot.mjs'
      - 'scripts/update_core_snapshot.mjs'
      - 'scripts/update_bok_rate.mjs'
      - 'scripts/update_research_insights.mjs'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Refresh Research Insight Snapshot'
    types:
      - completed
  schedule:
    # Korean market hours: near-live public snapshots every 10 minutes, weekdays.
    - cron: '*/10 0-7 * * 1-5'
    # Macro/rates/fundamental public feeds continue refreshing outside Korean market hours.
    # No personal API keys, private endpoints, Vercel functions, or paid proxy are used.
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Naver KOSPI KOSDAQ snapshot
        id: equity_snapshot
        continue-on-error: true
        run: node scripts/update_equity_snapshot.mjs

      - name: Report Equity snapshot fallback
        if: steps.equity_snapshot.outcome != 'success'
        run: echo 'Public Naver market refresh failed. Deploying last-good public snapshot or DATA PENDING; no fabricated values.'

      - name: Refresh Naver/Npay theme snapshot
        id: theme_snapshot
        continue-on-error: true
        run: node scripts/update_theme_snapshot.mjs

      - name: Report Theme snapshot fallback
        if: steps.theme_snapshot.outcome != 'success'
        run: echo 'Public Naver/Npay theme refresh failed. Theme board will use direct public browser fetch, snapshot fallback, or DATA PENDING.'

      - name: Refresh Naver/Npay market tape snapshot
        id: market_strip_snapshot
        continue-on-error: true
        run: node scripts/update_market_strip_snapshot.mjs

      - name: Report Market Tape snapshot fallback
        if: steps.market_strip_snapshot.outcome != 'success'
        run: echo 'Public Naver/Npay indicator refresh failed. Market tape will use direct public browser fetch, last-good public snapshot, or DATA PENDING.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/v3
          cp -R prototype/valkyrie-v2.5/. _site/
          cp -R prototype/valkyrie-v3/. _site/v3/
          BUILD_REV="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_REV__/${BUILD_REV}/g" _site/v3/index.html
          if grep -q '__BUILD_REV__' _site/v3/index.html; then
            echo 'ERROR: unresolved VALKYRIE render revision placeholder'
            exit 1
          fi
          touch _site/.nojekyll

      - name: Upload VALKYRIE site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
