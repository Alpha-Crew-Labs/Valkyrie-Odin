name: Deploy VALKYRIE to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/valkyrie-v2.5/**'
      - 'prototype/valkyrie-v3/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/v3
          cp -R prototype/valkyrie-v2.5/. _site/
          cp -R prototype/valkyrie-v3/. _site/v3/
          touch _site/.nojekyll

      - name: Upload VALKYRIE site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
