name: Deploy VALKYRIE to GitHub Pages

# Site layout (https://alpha-crew-labs.github.io/Valkyrie-Odin/)
#   /        VALKYRIE v4 — canonical public build (prototype/valkyrie-v4/web, snapshot bundle rebuilt here)
#   /v4/     redirect to / (pinned alias, no duplicate payload)
#   /intro/  v4 introduction page
#   /v3/     v3 static baseline
#   /v2.5/   v2.5 static fallback
#
# Quota-friendly cadence (GitHub Pages / Actions): every 30 minutes during KR market hours (market tiles only),
# a full refresh at the KR close (17:07 KST, also persists the refreshed daily series back to main so the public
# chain keeps moving without any API key), a few full refreshes in the evening/night, three per day on weekends.
# The v4 bundle is recomputed from public data; if any step fails the committed bundle ships instead
# (no fabricated values). Natural-language AI and real-time polling need the local server (run.ps1).

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/valkyrie-v4/**'
      - 'prototype/valkyrie-v2.5/**'
      - 'prototype/valkyrie-v3/**'
      - 'scripts/update_equity_snapshot.mjs'
      - 'scripts/update_theme_snapshot.mjs'
      - 'scripts/update_market_strip_snapshot.mjs'
      - 'scripts/update_core_snapshot.mjs'
      - 'scripts/update_bok_rate.mjs'
      - 'scripts/update_research_insights.mjs'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows:
      - 'Refresh Research Insight Snapshot'
    types:
      - completed
  schedule:
    # KR market hours (00-07 UTC = 09-16 KST, weekdays): market tiles every 30 minutes.
    - cron: '*/30 0-7 * * 1-5'
    # KR close (17:07 KST): full refresh + persist the daily series (EOD rows) back to main.
    - cron: '7 8 * * 1-5'
    # Weekday evening / night (US session, FRED updates): full refresh every 3 hours.
    - cron: '7 11,14,17,20,23 * * 1-5'
    # Weekends: three light full refreshes.
    - cron: '7 1,9,17 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      # Market-hours runs only refresh the market tiles; everything else is a full refresh.
      V4_FULL_REFRESH: ${{ github.event_name != 'schedule' || github.event.schedule != '*/30 0-7 * * 1-5' }}
      # The KR-close run (and a manual run) commits the refreshed daily series so the public chain stays continuous.
      V4_PERSIST: ${{ github.event.schedule == '7 8 * * 1-5' || github.event_name == 'workflow_dispatch' }}
      # v4 timestamps (collector fetchedAt, snapshot built_at, KR close detection) are Korean time.
      TZ: Asia/Seoul
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Naver KOSPI KOSDAQ snapshot
        id: equity_snapshot
        continue-on-error: true
        run: node scripts/update_equity_snapshot.mjs

      - name: Report Equity snapshot fallback
        if: steps.equity_snapshot.outcome != 'success'
        run: echo 'Public Naver market refresh failed. Deploying last-good public snapshot or DATA PENDING; no fabricated values.'

      - name: Refresh Macro Rates core snapshot
        id: core_snapshot
        continue-on-error: true
        run: |
          cp prototype/valkyrie-v3/data/core-live.json /tmp/core-live-before-refresh.json
          if node scripts/update_core_snapshot.mjs; then
            echo 'Core public snapshot refreshed.'
          else
            cp /tmp/core-live-before-refresh.json prototype/valkyrie-v3/data/core-live.json
            echo 'Core refresh failed; restored repository fallback.'
            exit 1
          fi

      - name: Supplement BOK base rate
        id: bok_rate
        if: steps.core_snapshot.outcome == 'success'
        continue-on-error: true
        run: node scripts/update_bok_rate.mjs

      - name: Report Core snapshot fallback
        if: steps.core_snapshot.outcome != 'success'
        run: echo 'Public Macro/Rates refresh failed. Deploying repository fallback or DATA PENDING; no fabricated values.'

      - name: Report BOK supplement fallback
        if: steps.core_snapshot.outcome == 'success' && steps.bok_rate.outcome != 'success'
        run: echo 'BOK supplement refresh failed. Core public snapshot remains valid without the supplemental rate update.'

      - name: Refresh Naver/Npay theme snapshot
        id: theme_snapshot
        continue-on-error: true
        run: node scripts/update_theme_snapshot.mjs

      - name: Report Theme snapshot fallback
        if: steps.theme_snapshot.outcome != 'success'
        run: echo 'Public Naver/Npay theme refresh failed. Theme board will use direct public browser fetch, snapshot fallback, or DATA PENDING.'

      - name: Refresh Naver/Npay market tape snapshot
        id: market_strip_snapshot
        continue-on-error: true
        run: node scripts/update_market_strip_snapshot.mjs

      - name: Report Market Tape snapshot fallback
        if: steps.market_strip_snapshot.outcome != 'success'
        run: echo 'Public Naver/Npay indicator refresh failed. Market tape will use direct public browser fetch, last-good public snapshot, or DATA PENDING.'

      # ---------------------------------------------------------------- VALKYRIE v4 (site root)
      - name: Set up Python for the v4 engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: prototype/valkyrie-v4/requirements.txt

      - name: Install v4 owner-model dependencies (8512 equity model)
        run: python -m pip install --quiet --disable-pip-version-check pandas numpy

      - name: Refresh v4 public market data (NAVER)
        id: v4_naver
        continue-on-error: true
        timeout-minutes: 12
        working-directory: prototype/valkyrie-v4
        env:
          PYTHONIOENCODING: utf-8
        run: python pipeline/collect_naver.py

      - name: Refresh v4 research samples (CB Zero Finder / 38 / NAVER financials)
        id: v4_research
        if: env.V4_FULL_REFRESH == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: prototype/valkyrie-v4
        env:
          PYTHONIOENCODING: utf-8
        run: python pipeline/collect_research.py

      - name: Refresh v4 daily series (ECOS/FRED with repository secrets, keyless public sources otherwise)
        id: v4_series
        if: env.V4_FULL_REFRESH == 'true'
        continue-on-error: true
        timeout-minutes: 10
        working-directory: prototype/valkyrie-v4
        env:
          PYTHONIOENCODING: utf-8
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python pipeline/collect.py

      - name: Rebuild v4 model, snapshots and public bundle
        id: v4_bundle
        continue-on-error: true
        timeout-minutes: 15
        working-directory: prototype/valkyrie-v4
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python pipeline/model.py
          python pipeline/snapshot.py
          python pipeline/check.py

      - name: Report v4 bundle fallback
        if: steps.v4_bundle.outcome != 'success'
        run: |
          echo 'v4 rebuild failed; deploying the committed snapshot bundle (no fabricated values).'
          git checkout -- prototype/valkyrie-v4/web/data prototype/valkyrie-v4/data
          git clean -fdq prototype/valkyrie-v4/web/data

      - name: Report v4 refresh outcomes
        run: |
          echo "v4 NAVER market data: ${{ steps.v4_naver.outcome }}"
          echo "v4 research samples:  ${{ steps.v4_research.outcome }} (full refresh: ${{ env.V4_FULL_REFRESH }})"
          echo "v4 daily series:      ${{ steps.v4_series.outcome }}"
          echo "v4 bundle rebuild:    ${{ steps.v4_bundle.outcome }}"
          echo "v4 persist to main:   ${{ env.V4_PERSIST }} (event: ${{ github.event_name }} ${{ github.event.schedule }})"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/v4 _site/v3 _site/v2.5 _site/intro

          # VALKYRIE v4 is the canonical public build (root). GitHub Pages has no Python server, so the page
          # runs in WEB mode from the bundle rebuilt above. /v4/ stays a working address as a redirect.
          cp -R prototype/valkyrie-v4/web/. _site/
          printf '%s\n' '<!doctype html>' '<meta charset="utf-8">' '<meta http-equiv="refresh" content="0; url=../">' \
            '<title>VALKYRIE v4</title>' '<a href="../">VALKYRIE v4 →</a>' > _site/v4/index.html
          cp -R prototype/valkyrie-v4/intro/. _site/intro/
          rm -f _site/intro/build_intro.py _site/intro/VALKYRIE_intro.html

          # Preserve legacy builds for regression/comparison.
          cp -R prototype/valkyrie-v2.5/. _site/v2.5/
          cp -R prototype/valkyrie-v3/. _site/v3/

          BUILD_REV="${GITHUB_SHA::12}"
          sed -i "s/__BUILD_REV__/${BUILD_REV}/g" _site/v3/index.html
          if grep -q '__BUILD_REV__' _site/v3/index.html; then
            echo 'ERROR: unresolved VALKYRIE render revision placeholder'
            exit 1
          fi

          # Guard the canonical root: fail rather than silently publishing a legacy build.
          test -f _site/index.html
          grep -q 'VALKYRIE v4' _site/index.html
          test -f _site/data/bundle.js && test -f _site/js/main.js
          touch _site/.nojekyll
          du -sh _site

      - name: Upload VALKYRIE site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # After the deploy: keep the public daily series continuous without API keys. Only the small ECOS/FRED
      # CSVs (one row per day) and their manifest are committed; the NAVER/research snapshots are rebuilt every
      # run and never committed. "[skip ci]" prevents this push from re-triggering the deploy.
      - name: Persist refreshed v4 daily series
        if: env.V4_PERSIST == 'true' && steps.v4_series.outcome == 'success' && steps.v4_bundle.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prototype/valkyrie-v4/data/00_RAW/*.csv prototype/valkyrie-v4/data/00_RAW/_manifest.json
          if git diff --cached --quiet; then
            echo 'No daily-series changes to persist.'
            exit 0
          fi
          git commit -m 'data(v4): persist refreshed public daily series [skip ci]'
          git checkout -- .          # the rest of the refreshed tree was only needed for the deploy above
          git pull --rebase origin main
          git push origin HEAD:main
