name: Deploy VALKYRIE to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'prototype/valkyrie-v2.5/**'
      - 'prototype/valkyrie-v3/**'
      - 'scripts/update_equity_snapshot.mjs'
      - '.github/workflows/pages.yml'
  schedule:
    # Near-live Korean market snapshot. 09:00~16:59 KST, weekdays; GitHub cron may be delayed.
    - cron: '*/10 0-7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Naver KOSPI KOSDAQ snapshot
        id: equity_snapshot
        continue-on-error: true
        run: node scripts/update_equity_snapshot.mjs

      - name: Report Equity snapshot fallback
        if: steps.equity_snapshot.outcome != 'success'
        run: echo 'Naver market refresh failed. Deploying repository fallback; IPO/CB structural signals remain independent.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site/v3
          cp -R prototype/valkyrie-v2.5/. _site/
          cp -R prototype/valkyrie-v3/. _site/v3/
          touch _site/.nojekyll

      - name: Upload VALKYRIE site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
