name: Prototype Validation

on:
  pull_request:
    paths:
      - 'prototype/valkyrie-v2/**'
      - 'prototype/valkyrie-v2.5/**'
      - 'prototype/valkyrie-v3/**'
      - 'scripts/validate_prototype.mjs'
      - 'scripts/validate_v25.mjs'
      - 'scripts/validate_v3.mjs'
      - 'scripts/validate_render_parity.mjs'
      - 'scripts/update_equity_snapshot.mjs'
      - 'scripts/update_theme_snapshot.mjs'
      - 'scripts/update_market_strip_snapshot.mjs'
      - '.github/workflows/prototype-validation.yml'
  push:
    branches:
      - main
      - feat/v3-ontology-command-center
    paths:
      - 'prototype/valkyrie-v2/**'
      - 'prototype/valkyrie-v2.5/**'
      - 'prototype/valkyrie-v3/**'
      - 'scripts/validate_prototype.mjs'
      - 'scripts/validate_v25.mjs'
      - 'scripts/validate_v3.mjs'
      - 'scripts/validate_render_parity.mjs'
      - 'scripts/update_equity_snapshot.mjs'
      - 'scripts/update_theme_snapshot.mjs'
      - 'scripts/update_market_strip_snapshot.mjs'
      - '.github/workflows/prototype-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JavaScript syntax check
        run: |
          node --check prototype/valkyrie-v2/data.js
          node --check prototype/valkyrie-v2/system.js
          node --check prototype/valkyrie-v2/runtime.js
          node --check prototype/valkyrie-v2.5/data.js
          node --check prototype/valkyrie-v2.5/core.js
          node --check prototype/valkyrie-v2.5/view.js
          node --check prototype/valkyrie-v2.5/interaction.js
          node --check prototype/valkyrie-v3/data-core.js
          node --check prototype/valkyrie-v3/view.js
          node --check prototype/valkyrie-v3/interaction.js
          node --check prototype/valkyrie-v3/quant-hk.js
          node --check prototype/valkyrie-v3/equity-yc.js
          node --check prototype/valkyrie-v3/live-equity.js
          node --check prototype/valkyrie-v3/theme-equity.js
          node --check prototype/valkyrie-v3/market-strip.js
          node --check scripts/update_equity_snapshot.mjs
          node --check scripts/update_theme_snapshot.mjs
          node --check scripts/update_market_strip_snapshot.mjs
          node --check scripts/validate_render_parity.mjs

      - name: Validate v2 reference invariants
        run: node scripts/validate_prototype.mjs

      - name: Validate v2.5 release invariants
        run: node scripts/validate_v25.mjs

      - name: Validate v3 rebased v2.6 release invariants
        run: node scripts/validate_v3.mjs

      - name: Validate web/download render parity
        run: node scripts/validate_render_parity.mjs
