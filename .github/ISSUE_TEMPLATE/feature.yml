name: Feature / Experiment
description: VALKYRIE 기능, 시각화, Quant 통합 또는 UX 개선 제안
title: "[Feature] "
labels: []
body:
  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - Platform / Integration
        - MACRO
        - RATES
        - EQUITY
        - Quant Engine
        - Replay / Decision Log
        - Motion / Visualization
        - Demo / Deployment
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: 어떤 사용자 문제 또는 데모 문제를 해결하나요?
      placeholder: 현재 상태와 문제를 간결하게 적어주세요.
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Desired system behavior
      description: Object → Ontology → Inspector → Workspace → Signal 관점에서 어떻게 반응해야 하나요?
      placeholder: "예: UST10Y에 +50bp stress를 적용하면..."
    validations:
      required: true

  - type: textarea
    id: data
    attributes:
      label: Data / model dependency
      description: 필요한 데이터, 모델, API 또는 sample fixture가 있나요?

  - type: textarea
    id: demo
    attributes:
      label: Demo value
      description: 해커톤 데모에서 어떻게 보여줄 수 있나요?

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: Public repo에 올려도 되는 데이터만 사용한다.
          required: true
        - label: 기존 금융 온톨로지 변경이 필요하면 이유를 문서화한다.
          required: true
        - label: 외부 API 실패 시 fallback을 고려한다.
          required: true
